<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · ZheZhe Blog</title>
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --accent: #5b6ef5;
      --accent-2: #7c5cf5;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
              "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto,
              Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 600px at 15% 0%, #232b52 0%, #12162a 45%, #0b0e1c 100%);
      color: #e8ecf6;
      position: relative;
      overflow: hidden;
    }
    /* floating light blobs */
    body::before, body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .55;
      pointer-events: none;
    }
    body::before { width: 420px; height: 420px; background: #5b6ef5; top: -140px; left: -120px; }
    body::after  { width: 380px; height: 380px; background: #7c5cf5; bottom: -150px; right: -110px; }

    .card {
      position: relative;
      z-index: 2;
      width: 360px;
      max-width: calc(100vw - 40px);
      padding: 38px 34px 30px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand img {
      width: 44px; height: 44px; border-radius: 12px; object-fit: cover;
      box-shadow: 0 8px 20px -8px rgba(0,0,0,.7);
      background: #fff;
    }
    .brand .titles h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: .2px; }
    .brand .titles p { margin: 2px 0 0; font-size: 12.5px; color: #9aa3bd; }

    label { display: block; font-size: 12.5px; color: #a7afc6; margin: 0 0 7px 2px; font-weight: 600; }
    .field { margin-bottom: 16px; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: var(--font);
      color: #fff;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 11px;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    input::placeholder { color: #757d95; }
    input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, .1);
      box-shadow: 0 0 0 4px rgba(91, 110, 245, .25);
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      font-family: var(--font);
      color: #fff;
      border: none;
      border-radius: 11px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 14px 30px -12px var(--accent);
      transition: transform .12s ease, box-shadow .18s ease, filter .18s ease;
    }
    button:hover { filter: brightness(1.06); box-shadow: 0 18px 36px -12px var(--accent); }
    button:active { transform: translateY(1px); }

    .hint { margin-top: 18px; text-align: center; font-size: 11.5px; color: #7b839c; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <div class="brand">
      <img src="logo.png" alt="logo">
      <div class="titles">
        <h1>ZheZhe Blog</h1>
        <p>内容管理后台</p>
      </div>
    </div>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" placeholder="username" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="submit">登 录</button>
    <div class="hint">仅限博主使用 · hexo-admin</div>
  </form>
</body>
</html>
